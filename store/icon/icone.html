<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  svg{display:block}
</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6A34"/>
      <stop offset="1" stop-color="#0C3016"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D06A"/>
      <stop offset="0.5" stop-color="#D8AE3A"/>
      <stop offset="1" stop-color="#B8891F"/>
    </linearGradient>
    <linearGradient id="escudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF3"/>
      <stop offset="1" stop-color="#E9E6D6"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3E6"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#04160A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo verde -->
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <!-- brilho suave no topo -->
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <ellipse cx="512" cy="120" rx="720" ry="360" fill="#ffffff" opacity="0.05"/>

  <!-- losango do Brasil, sutil -->
  <g transform="translate(512 512) rotate(45)">
    <rect x="-300" y="-300" width="600" height="600" rx="40" fill="none" stroke="url(#ouro)" stroke-width="16" opacity="0.55"/>
  </g>

  <!-- escudo (cofre / proteção) -->
  <g filter="url(#sombra)">
    <path d="M512 236
             L716 300
             C724 302 730 309 730 318
             L730 556
             C730 690 636 774 512 826
             C388 774 294 690 294 556
             L294 318
             C294 309 300 302 308 300
             Z"
          fill="url(#escudo)" stroke="url(#ouro)" stroke-width="16"/>

    <!-- documento dentro do escudo -->
    <g>
      <path d="M420 372
               L556 372
               L620 436
               L620 620
               C620 634 609 645 595 645
               L420 645
               C406 645 395 634 395 620
               L395 397
               C395 383 406 372 420 372 Z"
            fill="url(#doc)" stroke="#B8891F" stroke-width="7"/>
      <!-- dobra do canto -->
      <path d="M556 372 L556 436 L620 436 Z" fill="#E5DFC7" stroke="#B8891F" stroke-width="7" stroke-linejoin="round"/>
      <!-- linhas do texto -->
      <rect x="430" y="470" width="150" height="15" rx="7.5" fill="#3B5A24"/>
      <rect x="430" y="507" width="150" height="15" rx="7.5" fill="#7C8A63"/>
      <rect x="430" y="544" width="105" height="15" rx="7.5" fill="#7C8A63"/>
    </g>

    <!-- fechadura de cofre -->
    <g transform="translate(512 705)">
      <circle cx="0" cy="0" r="46" fill="#1E6A34"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#ouro)" stroke-width="9"/>
      <circle cx="0" cy="-8" r="15" fill="url(#ouro)"/>
      <path d="M-9 -2 L9 -2 L15 26 L-15 26 Z" fill="url(#ouro)"/>
    </g>
  </g>
</svg>
</body>
</html>
