<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixar a Carteira CAC</title>
<meta name="description" content="Baixe a Carteira CAC — seu acervo de CAC organizado, seguro e sempre em dia. Disponível para iPhone e Android.">
<meta name="theme-color" content="#0F3D1E">
<link rel="canonical" href="https://www.meucac.com/download/">

<!-- Open Graph / compartilhamento -->
<meta property="og:title" content="Baixar a Carteira CAC">
<meta property="og:description" content="Seu acervo de CAC organizado, seguro e sempre em dia. iPhone e Android.">
<meta property="og:url" content="https://www.meucac.com/download/">
<meta property="og:type" content="website">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --verde:#0F3D1E; --verde2:#0A2712; --verde3:#061A0B; --verde-claro:#1E6A34;
    --ouro:#D8AE3A; --ouro2:#F4D06A; --creme:#FBFAF3; --sage:#C6D9BC;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--creme); min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    background:
      radial-gradient(760px 620px at 80% 8%, rgba(30,106,52,.55), transparent 60%),
      radial-gradient(640px 560px at 4% 100%, rgba(216,174,58,.12), transparent 62%),
      linear-gradient(162deg, var(--verde) 0%, var(--verde2) 56%, var(--verde3) 100%);
    position:relative; overflow:hidden;
  }
  .rhombus{position:absolute;right:-180px;top:-120px;width:520px;height:520px;
    transform:rotate(45deg);border:18px solid var(--ouro);opacity:.09;border-radius:48px;pointer-events:none}
  .rhombus.b{right:auto;left:-220px;bottom:-200px;top:auto;width:420px;height:420px;opacity:.06;border-width:14px}

  .card{position:relative;width:100%;max-width:440px;text-align:center}

  .shield{width:104px;height:auto;margin:0 auto 26px;display:block;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}

  .marca{font-size:14px;font-weight:800;letter-spacing:6px;color:var(--ouro2);margin-bottom:6px}
  h1{font-size:30px;line-height:1.15;letter-spacing:-.6px;font-weight:800;color:var(--creme);margin-bottom:14px}
  .sub{font-size:16.5px;line-height:1.5;color:var(--sage);max-width:360px;margin:0 auto}

  .status{min-height:22px;margin:22px 0 4px;font-size:14px;letter-spacing:.3px;color:var(--ouro2);
    font-weight:600;opacity:0;transition:opacity .3s}
  .status.show{opacity:1}
  .status .spin{display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-2px;
    border:2px solid rgba(244,208,106,.35);border-top-color:var(--ouro2);border-radius:50%;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .lojas{display:flex;flex-direction:column;gap:14px;margin-top:22px}
  .store{display:flex;align-items:center;justify-content:center;gap:14px;
    text-decoration:none;color:#fff;background:#11140F;border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:15px 22px;transition:transform .12s ease,border-color .2s,background .2s}
  .store:hover{transform:translateY(-2px);border-color:rgba(216,174,58,.55);background:#171B14}
  .store:active{transform:translateY(0)}
  .store svg{width:30px;height:30px;flex:none;fill:#fff}
  .store .tx{text-align:left;line-height:1.15}
  .store .tx small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aeb6a6}
  .store .tx b{font-size:19px;font-weight:700;letter-spacing:.2px}

  .ou{margin-top:20px;font-size:13px;color:var(--sage);opacity:.8}
  .ou a{color:var(--ouro2);text-decoration:none;font-weight:600}
  .ou a:hover{text-decoration:underline}

  .foot{margin-top:28px;font-size:12.5px;letter-spacing:.4px;color:rgba(198,217,188,.6)}
  .foot a{color:inherit;text-decoration:none}
  .foot a:hover{color:var(--ouro2)}

  @media (max-width:360px){ h1{font-size:26px} }
</style>
</head>
<body>
  <div class="rhombus"></div><div class="rhombus b"></div>

  <main class="card">
    <!-- escudo da marca (SVG inline, sem dependências) -->
    <svg class="shield" viewBox="0 0 120 140" role="img" aria-label="Carteira CAC">
      <path d="M60 5 L110 23 V74 C110 105 88 125 60 135 C32 125 10 105 10 74 V23 Z"
            fill="#FBFAF3" stroke="#D8AE3A" stroke-width="6" stroke-linejoin="round"/>
      <rect x="40" y="38" width="40" height="48" rx="6" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
      <path d="M70 38 h4 l6 6 v2 h-10 Z" fill="#E6DFC4"/>
      <line x1="48" y1="54" x2="72" y2="54" stroke="#2F5E33" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="63" x2="72" y2="63" stroke="#6E8F5E" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="72" x2="64" y2="72" stroke="#8AA87A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="60" cy="98" r="13" fill="#1E6A34" stroke="#D8AE3A" stroke-width="2.5"/>
      <circle cx="60" cy="95" r="3.4" fill="#F4D06A"/>
      <rect x="58.2" y="96" width="3.6" height="8" rx="1.8" fill="#F4D06A"/>
    </svg>

    <div class="marca">CARTEIRA CAC</div>
    <h1>Baixe a Carteira&nbsp;CAC</h1>
    <p class="sub">Seu acervo de CAC organizado, seguro e sempre em dia — no iPhone ou no Android.</p>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="lojas" id="lojas">
      <a class="store" id="btn-ios" href="https://apps.apple.com/br/app/carteira-cac/id6814230068"
         rel="noopener" aria-label="Baixar na App Store">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.1 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <span class="tx"><small>Baixar na</small><b>App Store</b></span>
      </a>

      <a class="store" id="btn-android" href="https://play.google.com/store/apps/details?id=br.com.cacbrasil.carteira"
         rel="noopener" aria-label="Disponível no Google Play">
        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M48 23.6C40.3 27.9 35.3 35.9 35.3 46.8v418.4c0 10.9 5 18.9 12.7 23.2l236.9-232.2L48 23.6zM318.6 222.9l-54.2-53.1L62.9 54.3l255.7 168.6zm0 66.2L62.9 457.7l201.5-115.5 54.2-53.1zm40.2-23.5l64.9-37.9c20.2-11.8 20.2-37.7 0-49.5l-64.9-37.9-59.3 62.6 59.3 62.6z"/></svg>
        <span class="tx"><small>Disponível no</small><b>Google Play</b></span>
      </a>
    </div>

    <p class="ou" id="ou-manual"></p>

    <p class="foot"><a href="https://www.meucac.com">www.meucac.com</a></p>
  </main>

  <script>
  (function () {
    var APP_STORE = "https://apps.apple.com/br/app/carteira-cac/id6814230068";
    var PLAY      = "https://play.google.com/store/apps/details?id=br.com.cacbrasil.carteira";

    var ua = navigator.userAgent || navigator.vendor || window.opera || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                // iPadOS 13+ se identifica como Mac com toque
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);

    var status = document.getElementById("status");
    var ouManual = document.getElementById("ou-manual");

    function redirecionar(url, nomeLoja, idOutra) {
      status.innerHTML = '<span class="spin"></span>Abrindo a ' + nomeLoja + '…';
      status.classList.add("show");
      // deixa a loja correta em destaque e some com a outra
      var outra = document.getElementById(idOutra);
      if (outra) outra.style.display = "none";
      ouManual.innerHTML = 'Não abriu? <a href="' + url + '">Toque aqui para baixar</a>.';

      // pequeno atraso para a página pintar antes do redirect
      setTimeout(function () { window.location.replace(url); }, 350);
    }

    if (isIOS) {
      redirecionar(APP_STORE, "App Store", "btn-android");
    } else if (isAndroid) {
      redirecionar(PLAY, "Google Play", "btn-ios");
    } else {
      // Desktop / aparelho não reconhecido: mostra os dois botões
      status.textContent = "Escolha a loja do seu aparelho:";
      status.classList.add("show");
    }
  })();
  </script>

  <noscript>
    <p style="text-align:center;color:#C6D9BC;margin-top:14px;font-size:14px">
      Escolha a loja do seu aparelho acima.
    </p>
  </noscript>
</body>
</html>
