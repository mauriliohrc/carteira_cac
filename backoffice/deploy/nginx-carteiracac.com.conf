# /etc/nginx/sites-available/carteiracac.com
# Apex + www da Carteira CAC -> app Next do backoffice (porta 3001).
# O middleware do backoffice decide por Host:
#   carteiracac.com / www.carteiracac.com  -> landing (public/index.html)
#   backoffice.carteiracac.com             -> painel admin (bloco proprio)
#
# server_name EXATO tem precedencia sobre o regex wildcard.carteiracac.com,
# entao este bloco captura www e o apex corretamente.
#
# Deploy:
#   1) DNS: apontar A de carteiracac.com e www.carteiracac.com -> 103.199.185.76
#   2) sudo cp este arquivo para /etc/nginx/sites-available/carteiracac.com
#   3) sudo ln -sf /etc/nginx/sites-available/carteiracac.com /etc/nginx/sites-enabled/
#   4) sudo certbot --nginx -d carteiracac.com -d www.carteiracac.com   (adiciona SSL + redirect 80->443)
#   5) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name carteiracac.com www.carteiracac.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
